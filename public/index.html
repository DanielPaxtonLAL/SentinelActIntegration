<!DOCTYPE html>
<html lang="en">
<head>
  <!-- include: head -->
  <title>ACT Companies</title>
</head>
<body>
  <main id="app" class="customers-page" v-cloak>
    <!-- include: disclaimer -->
    <header class="app-header">
      <h1>Customers</h1>
      <div class="header-actions">
        <div id="actStatus" :class="{ error: Boolean(actError) }">{{ actStatus }}</div>
        <button type="button" class="button--view" @click="loadCompanies" :disabled="actLoading">Reload</button>
        <button type="button" @click="logout" :disabled="actLoading">Log out</button>
      </div>
    </header>
    <!-- include: nav -->
    <div class="layout">
      <aside class="sidebar" aria-label="ACT companies">
        <h2>Companies</h2>
        <input class="company-filter" v-model="companyFilter" placeholder="Search companies…" aria-label="Search companies">
        <p class="company-count">{{ filteredCompanies.length }} companies</p>
        <nav class="company-list" aria-label="Company list">
          <div v-if="divisionIndexError" class="company-tree-error">{{ divisionIndexError }}</div>
          <ul v-if="companyTree.length" class="company-tree">
            <company-tree-node v-for="node in companyTree" :key="node.key"
              :node="node" :selected-company="selectedCompany" @select="selectCompany" />
          </ul>
          <div v-if="!filteredCompanies.length" class="empty-list">
            {{ companies.length ? 'No matching companies' : (actLoading ? 'Loading companies…' : 'No companies found') }}
          </div>
        </nav>
      </aside>
      <section class="details" aria-live="polite">
        <template v-if="selectedCompany">
          <h2>{{ selectedCompany.name || 'Unnamed company' }}</h2>
          <dl class="company-details">
            <dt>ID</dt><dd>{{ selectedCompany.id }}</dd>
            <dt>Phone</dt><dd>{{ selectedCompany.businessPhone || selectedCompany.phone || selectedCompany.mainPhone || '—' }}</dd>
            <dt>City</dt><dd>{{ selectedCompany.city || (selectedCompany.address && selectedCompany.address.city) || (selectedCompany.businessAddress && selectedCompany.businessAddress.city) || '—' }}</dd>
            <dt>Country</dt><dd>{{ selectedCompany.country || (selectedCompany.address && selectedCompany.address.country) || (selectedCompany.businessAddress && selectedCompany.businessAddress.country) || '—' }}</dd>
            <dt>Website</dt><dd>{{ selectedCompany.webSite || selectedCompany.website || '—' }}</dd>
          </dl>
          <p>
            <button type="button" class="button--constructive" @click="addCompanyToEms(selectedCompany)"
              :disabled="!selectedCompany.id || selectedCompany.hasDivisions || inEms(selectedCompany) || (companySync[selectedCompany.id] && ['adding', 'added'].includes(companySync[selectedCompany.id].state))">
              {{ companySync[selectedCompany.id]?.state === 'adding' ? 'Adding…' : (inEms(selectedCompany) || companySync[selectedCompany.id]?.state === 'added') ? 'In EMS' : selectedCompany.hasDivisions ? 'Add a division instead' : 'Add to EMS' }}
            </button>
          </p>
          <div v-if="companySync[selectedCompany.id]?.error" class="sync-error">
            {{ companySync[selectedCompany.id].error }}
          </div>
        </template>
        <p v-else-if="actLoading">Loading companies…</p>
        <p v-else>Select a company from the sidebar.</p>
      </section>
    </div>
  </main>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="/pages/index.js"></script>
</body>
</html>
