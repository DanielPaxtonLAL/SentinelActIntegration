<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EMS Entitlements</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #222; font-family: system-ui, sans-serif; }
    button { font: inherit; cursor: pointer; }
    button:disabled { cursor: default; }
    .dev-disclaimer { margin: 0; padding: 0; background: #ffeb3b; text-align: center; }
    .app-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem 1.5rem; border-bottom: 1px solid #ddd; }
    h1 { margin: 0; font-size: 1.35rem; }
    .header-actions { display: flex; align-items: center; gap: .75rem; }
    #status { color: #666; white-space: pre-wrap; word-break: break-word; }
    #status.error { color: #b00020; }
    .tab-nav { display: flex; gap: .25rem; padding: 0 1.5rem; border-bottom: 1px solid #ddd; }
    .tab-nav a { padding: .65rem .9rem; color: #444; text-decoration: none; border-bottom: 3px solid transparent; }
    .tab-nav a:hover { background: #f5f5f5; }
    .tab-nav a[aria-current="page"] { color: #123b68; border-bottom-color: #123b68; font-weight: 600; }
    @media (max-width: 640px) { .tab-nav { overflow-x: auto; padding: 0 .5rem; } .tab-nav a { white-space: nowrap; } }
    main { padding: 1.5rem; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .45rem .6rem; border-bottom: 1px solid #ddd; text-align: left; vertical-align: top; }
    th { background: #f3f3f3; }
    tbody tr:nth-child(even) { background: #f8f8f8; }
    td { overflow-wrap: anywhere; }
    [v-cloak] { display: none; }
    @media (max-width: 640px) {
      .app-header { align-items: flex-start; flex-direction: column; }
      .header-actions { flex-wrap: wrap; }
      main { padding: 1rem; }
    }
  </style>
</head>
<body>
  <main id="app" v-cloak>
    <div class="dev-disclaimer">DEVELOPMENT - NOT LIVE</div>
    <header class="app-header">
      <h1>Entitlements</h1>
      <div class="header-actions">
        <div id="status" :class="{ error: Boolean(error) }" role="status" aria-live="polite">{{ status }}</div>
        <button type="button" @click="loadEntitlements" :disabled="loading">Reload</button>
        <button type="button" @click="logout" :disabled="loading">Log out</button>
      </div>
    </header>
    <nav class="tab-nav" aria-label="Main navigation">
      <a href="#" onclick="event.preventDefault()">Home</a>
      <a href="#" onclick="event.preventDefault()">Catalog</a>
      <a href="/entitlements.html" aria-current="page">Entitlements</a>
      <a href="/">Customers</a>
      <a href="#" onclick="event.preventDefault()">Reports</a>
      <a href="#" onclick="event.preventDefault()">Administration</a>
      <a href="/custom-entities.html">Developer</a>
    </nav>
    <section class="table-wrap">
      <table v-if="entitlements.length">
        <thead><tr><th v-for="column in columns" :key="column">{{ column }}</th></tr></thead>
        <tbody>
          <tr v-for="(entitlement, index) in entitlements" :key="(entitlement && (entitlement.id || entitlement.entitlementId)) || index">
            <td v-for="column in columns" :key="column">{{ formatValue(cellValue(entitlement, column)) }}</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return { entitlements: [], loading: false, error: '' };
      },
      computed: {
        status() {
          if (this.loading) return 'Loading entitlements…';
          if (this.error) return this.error;
          return `${this.entitlements.length} entitlements`;
        },
        columns() {
          return [...new Set(this.entitlements.flatMap((item) =>
            item && typeof item === 'object' && !Array.isArray(item) ? Object.keys(item) : ['value']
          ))];
        },
      },
      methods: {
        cellValue(item, column) {
          return column === 'value' && (item === null || typeof item !== 'object') ? item : item[column];
        },
        formatValue(value) {
          return value !== null && typeof value === 'object' ? JSON.stringify(value) : String(value ?? '');
        },
        async loadEntitlements() {
          this.loading = true;
          this.error = '';
          try {
            const response = await fetch('/api/entitlements');
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || response.statusText);
            if (!Array.isArray(data)) throw new Error('The server returned an invalid entitlements list');
            this.entitlements = data;
          } catch (err) {
            this.error = 'Failed to load entitlements: ' + err.message;
          } finally {
            this.loading = false;
          }
        },
        async logout() {
          this.loading = true;
          this.error = '';
          try {
            const response = await fetch('/api/act/logout', { method: 'POST' });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || response.statusText);
            window.location.replace('/login.html');
          } catch (err) {
            this.error = 'Log out failed: ' + err.message;
            this.loading = false;
          }
        },
      },
      mounted() {
        this.loadEntitlements();
      },
    }).mount('#app');
  </script>
</body>
</html>
