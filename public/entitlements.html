<!DOCTYPE html>
<html lang="en">
<head>
  <!-- include: head -->
  <title>EMS Entitlements</title>
</head>
<body>
  <main id="app" class="entitlements-page" v-cloak>
    <!-- include: disclaimer -->
    <header class="app-header">
      <h1>Entitlements</h1>
      <div class="header-actions">
        <div v-if="status" id="status" :class="{ error: Boolean(error) }" role="status" aria-live="polite">{{ status }}</div>
        <button type="button" class="button--view" @click="loadEntitlements" :disabled="loading || producing || activating">Reload</button>
        <button type="button" @click="logout" :disabled="loading || activating">Log out</button>
      </div>
    </header>
    <!-- include: nav -->
    <section class="entitlements-layout">
      <div class="entitlement-list-panel">
        <div class="entitlements-subheading">
          <h2>Entitlements ({{ filteredEntitlements.length }})</h2>
          <input v-model.trim="filter" class="entitlement-filter" type="search"
            placeholder="Filter entitlements" aria-label="Filter entitlements across all attributes">
          <button type="button" class="button--constructive entitlement-create-button" @click="openCreateEntitlement" :disabled="loading || activating">Create entitlement</button>
        </div>
        <div class="table-wrap entitlement-list">
          <table v-if="filteredEntitlements.length">
            <thead>
              <tr>
                <th>Type</th>
                <th>Created Date</th>
                <th>Customer name</th>
                <th>Irricad Order Code (Ref ID 1)</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="(entitlement, index) in filteredEntitlements" :key="(entitlement && (entitlement.id || entitlement.entitlementId)) || index"
                  class="entitlement-row" :class="{ selected: selectedEntitlement && String(selectedEntitlement.id) === String(entitlement.id) }"
                  role="button" tabindex="0"
                  :aria-label="'View entitlement ' + displayValue(entitlement.id)"
                  :aria-pressed="Boolean(selectedEntitlement && String(selectedEntitlement.id) === String(entitlement.id))"
                  @click="openEntitlementDetails(entitlement)"
                  @keydown.enter.prevent="openEntitlementDetails(entitlement)"
                  @keydown.space.prevent="openEntitlementDetails(entitlement)">
                <td><template v-for="(part, partIndex) in highlightParts(typeLabel(entitlement.type))" :key="partIndex"><mark v-if="part.highlighted">{{ part.text }}</mark><template v-else>{{ part.text }}</template></template></td>
                <td :title="entitlement.createDate ? 'UTC, DD-MM-YYYY' : null"><template v-for="(part, partIndex) in highlightParts(formatUtcDate(entitlement.createDate))" :key="partIndex"><mark v-if="part.highlighted">{{ part.text }}</mark><template v-else>{{ part.text }}</template></template></td>
                <td><template v-for="(part, partIndex) in highlightParts(entitlement.customer)" :key="partIndex"><mark v-if="part.highlighted">{{ part.text }}</mark><template v-else>{{ part.text }}</template></template></td>
                <td><template v-for="(part, partIndex) in highlightParts(entitlement.refId1)" :key="partIndex"><mark v-if="part.highlighted">{{ part.text }}</mark><template v-else>{{ part.text }}</template></template></td>
                <td class="status-cell"><span class="status-tag" :class="statusTagClass(entitlement.state)"><template v-for="(part, partIndex) in highlightParts(entitlement.state)" :key="partIndex"><mark v-if="part.highlighted">{{ part.text }}</mark><template v-else>{{ part.text }}</template></template></span></td>
                <td class="entitlement-actions" @click.stop @keydown.stop>
                  <button type="button" class="button--constructive" :disabled="!isDraftEntitlement(entitlement) || producing || activating" @click="openEditEntitlement(entitlement)">Edit</button>
                </td>
              </tr>
            </tbody>
          </table>
          <p v-else-if="!loading && !error" class="entitlement-empty-list">{{ filter ? 'No matching entitlements.' : 'No entitlements found.' }}</p>
        </div>
      </div>
      <section class="entitlement-details" aria-live="polite">
        <template v-if="selectedEntitlement">
          <h2 class="entitlement-heading">{{ displayValue(selectedEntitlement.customerName || selectedEntitlement.customer || selectedEntitlement.customerId) }} - Entitlement Details - <span class="status-tag" :class="statusTagClass(selectedEntitlement.entState || selectedEntitlement.state)">{{ displayValue(selectedEntitlement.entState || selectedEntitlement.state) }}</span></h2>
          <p class="entitlement-description">{{ displayValue(selectedEntitlement.description || selectedEntitlement.descr) }}</p>
          <p v-if="detailLoading" role="status">Loading entitlement details…</p>
          <p v-if="detailError" class="form-error" role="alert">{{ detailError }}</p>
          <template v-if="!detailLoading && !detailError">
            <div class="entitlement-detail-fields" role="table" aria-label="Entitlement attributes">
              <div class="detail-row" role="row">
                <div class="detail-label" role="rowheader">Customer</div>
                <div class="detail-value" role="cell">{{ displayValue(selectedEntitlement.customerName || selectedEntitlement.customer || selectedEntitlement.customerId) }}</div>
              </div>
              <div class="detail-row" role="row">
                <div class="detail-label" role="rowheader">Serial Number*</div>
                <div class="detail-value" role="cell">{{ selectedSerialNumber }}</div>
              </div>
              <div class="detail-row" role="row">
                <div class="detail-label" role="rowheader">Irricad Order Code (Ref ID 1)</div>
                <div class="detail-value" role="cell">{{ displayValue(selectedEntitlement.refId1) }}</div>
              </div>
              <div class="detail-row" role="row">
                <div class="detail-label" role="rowheader">Created Date</div>
                <div class="detail-value" role="cell" :title="selectedEntitlement.createDate ? 'UTC, DD-MM-YYYY' : null">{{ formatUtcDate(selectedEntitlement.createDate) }}</div>
              </div>
              <div class="detail-row" role="row">
                <div class="detail-label" role="rowheader">Start Date</div>
                <div class="detail-value" role="cell" :title="selectedEntitlement.startDate ? 'Local time, DD-MM-YYYY' : null">{{ formatLocalDate(selectedEntitlement.startDate) }}</div>
              </div>
              <div class="detail-row" role="row">
                <div class="detail-label" role="rowheader">End Date</div>
                <div class="detail-value" role="cell" :title="selectedEntitlement.endDate && formatEndDate(selectedEntitlement.endDate) !== 'Never' ? 'Local time, DD-MM-YYYY' : null">{{ formatEndDate(selectedEntitlement.endDate) }}</div>
              </div>
              <div class="detail-row" role="row">
                <div class="detail-label" role="rowheader">Standalone Irricad</div>
                <div class="detail-value" role="cell">{{ productPresent('standalone') }}</div>
              </div>
              <div class="detail-row" role="row">
                <div class="detail-label" role="rowheader">Link Irricad</div>
                <div class="detail-value" role="cell">{{ productPresent('link') }}</div>
              </div>
              <div class="detail-row" role="row">
                <div class="detail-label" role="rowheader">Pivot Irricad</div>
                <div class="detail-value" role="cell">{{ productPresent('pivot') }}</div>
              </div>
              <div class="detail-row" role="row">
                <div class="detail-label" role="rowheader">Lease Irricad</div>
                <div class="detail-value" role="cell">{{ productPresent('lease') }}</div>
              </div>
              <div class="detail-row" role="row">
                <div class="detail-label" role="rowheader">Lease Expiry Date*</div>
                <div class="detail-value" role="cell" :title="/^\d{4}-\d{2}-\d{2}$/.test(selectedExpiryDate) ? 'Local time, DD-MM-YYYY' : null">{{ formatLocalDate(selectedExpiryDate) }}</div>
              </div>
              <div class="detail-row" role="row">
                <div class="detail-label" role="rowheader">Irricad Version*</div>
                <div class="detail-value" role="cell">{{ decodedVersion }}</div>
              </div>
            </div>
            <div class="detail-footer">
              <p class="detail-footnote">* Derived from Memory Segments in Base Product</p>
              <div v-if="canProduce" class="detail-actions">
                <button type="button" :disabled="detailsConfirmed || detailLoading || loading || producing || deleting"
                  :aria-pressed="detailsConfirmed" @click="confirmDetailsReviewed">I have checked these</button>
                <button type="button" class="button--constructive" :disabled="!detailsConfirmed || loading || producing || deleting || produceUncertain"
                  @click="produceSelectedEntitlement">{{ producing ? 'Producing…' : 'Produce entitlement' }}</button>
              </div>
            </div>
            <p v-if="produceError" class="form-error" role="alert">{{ produceError }}</p>
            <details v-if="isProductKeyGenerated" class="detail-collapsible product-key-details">
              <summary>Product Key</summary>
              <p v-if="productKeyLoading" role="status">Loading product key details…</p>
              <p v-else-if="productKeyError" class="form-error" role="alert">{{ productKeyError }} <button type="button" @click="loadProductKeys(selectedEntitlement.id, detailRequest)">Retry</button></p>
              <template v-else>
                <div v-for="key in productKeys" :key="key.productKeyId">
                  <button type="button" class="button--constructive"
                    :disabled="activating || loading || deleting || reopening || activationUncertainKeys.includes(key.productKeyId)"
                    @click="$event.currentTarget.nextElementSibling.click()">
                    {{ activating ? 'Activating…' : 'Activate' }}
                  </button>
                  <input type="file" accept=".c2v" hidden :aria-label="'Choose C2V for product key ' + key.productKeyId"
                    @change="activateProductKey(key, $event)">
                  <p v-if="activationUncertainKeys.includes(key.productKeyId)" class="form-error" role="alert">Activation may have succeeded. Check the Product Keys page for the license before retrying.</p>
                  <div class="entitlement-detail-fields" role="table" aria-label="Product key details">
                    <div v-for="field in productKeyFields" :key="field.name" class="detail-row" role="row">
                      <div class="detail-label" role="rowheader">{{ field.label }}</div>
                      <div class="detail-value" role="cell"><a v-if="field.name === 'productKeyId'" :href="productKeyDownloadUrl(key.productKeyId)" :download="productKeyFilename(key)">{{ key.productKeyId }}</a><template v-else>{{ displayValue(key[field.name]) }}</template></div>
                    </div>
                  </div>
                  <h4>Products</h4>
                  <p v-if="!key.productInfo.length">No products listed.</p>
                  <ul v-else><li v-for="(product, index) in key.productInfo" :key="index">{{ displayValue(product.productName) }} (ID: {{ displayValue(product.id) }}, identifier: {{ displayValue(product.productIdentifier) }}, type: {{ displayValue(product.type) }})</li></ul>
                  <h4>Activation attributes</h4>
                  <p v-if="!key.activationAttribute.length">No activation attributes listed.</p>
                  <div v-else class="table-wrap">
                    <table>
                      <thead><tr><th>Name</th><th>Value</th><th>ISV permission</th><th>End user permission</th></tr></thead>
                      <tbody><tr v-for="(attribute, index) in key.activationAttribute" :key="index"><td>{{ displayValue(attribute.attributeName) }}</td><td>{{ displayValue(attribute.attributeValue) }}</td><td>{{ displayValue(attribute.isvPermission) }}</td><td>{{ displayValue(attribute.endUserPermission) }}</td></tr></tbody>
                    </table>
                  </div>
                </div>
              </template>
              <p v-if="activationError" class="form-error" role="alert">{{ activationError }}</p>
              <p v-for="result in activationDownloads" :key="result.aid">
                Activation {{ result.aid }}:
                <a :href="licenseDownloadUrl(result.license)" :download="'Activation-' + result.aid.replace(/[^a-zA-Z0-9_-]/g, '_') + '.v2c'">Download V2C</a>
              </p>
            </details>
            <section v-if="isEntitlementComplete" class="product-key-details">
              <h3>Product Keys</h3>
              <p v-if="productKeyLoading" role="status">Loading product key details…</p>
              <p v-else-if="productKeyError" class="form-error" role="alert">{{ productKeyError }} <button type="button" @click="loadProductKeys(selectedEntitlement.id, detailRequest)">Retry</button></p>
              <template v-else>
                <div v-for="key in productKeys" :key="key.productKeyId">
                  <p>Product key ID: {{ displayValue(key.productKeyId) }}</p>
                  <p v-if="!protectionKeyIds(key).length">Protection key ID: Unavailable</p>
                  <div v-for="id in protectionKeyIds(key)" :key="id">
                    <p>Protection key ID: {{ id }}</p>
                    <button type="button" :disabled="historyPackages[id]?.loading" @click="downloadHistoryPackage(id)">
                      {{ historyPackages[id]?.loading ? 'Building…' : 'Download V2CP' }}
                    </button>
                    <p v-if="historyPackages[id]?.error" class="form-error" role="alert">{{ historyPackages[id].error }}</p>
                  </div>
                </div>
              </template>
            </section>
            <details class="detail-collapsible">
            <summary>Verbose Details</summary>
            <h3>Products</h3>
            <p v-if="!selectedEntitlement.products.length">No products are listed for this entitlement.</p>
            <div v-else class="table-wrap">
              <table>
                <thead>
                  <tr><th>Type</th><th>Product</th><th>Product ID</th></tr>
                </thead>
                <tbody>
                  <tr v-for="(product, index) in selectedEntitlement.products" :key="`${product.productId}-${index}`">
                    <td>{{ displayValue(product.lineItemType) }}</td>
                    <td>{{ displayValue(product.productName) }}</td>
                    <td>{{ displayValue(product.productId) }}</td>
                  </tr>
                </tbody>
              </table>
            </div>
            <h3>Base product memory</h3>
            <p v-if="!baseMemorySegments.length">No memory fields are listed for the base product.</p>
            <div v-else class="table-wrap">
              <table class="base-product-memory">
                <thead>
                  <tr><th>ID</th><th>Name</th><th>Size</th><th>Memory access</th><th>Value</th><th>Value (ASCII hex)</th></tr>
                </thead>
                <tbody>
                  <tr v-for="segment in baseMemorySegments" :key="segment.id">
                    <td>{{ displayValue(segment.id) }}</td>
                    <td>{{ displayValue(segment.name) }}</td>
                    <td>{{ displayValue(segment.size) }}</td>
                    <td>{{ memoryAccess(segment) }}</td>
                    <td><code>{{ hexValue(segment) }}</code></td>
                    <td><code>{{ asciiHexValue(segment) }}</code></td>
                  </tr>
                </tbody>
              </table>
            </div>
            </details>
            <details class="detail-collapsible danger-zone">
              <summary>DANGER ZONE</summary>
              <p v-if="canReopen" class="form-hint">Reopening returns this entitlement to draft state, where it can be deleted.</p>
              <button v-if="canReopen" type="button" class="button--destructive"
                :disabled="reopening || deleting || producing || activating || loading || reopenUncertain" @click="reopenSelectedEntitlement">
                {{ reopening ? 'Reopening…' : 'Reopen entitlement' }}
              </button>
              <p v-if="reopenError" class="form-error" role="alert">{{ reopenError }}</p>
              <p class="form-hint">Deleting an entitlement cannot be undone.</p>
              <button type="button" class="button--destructive" :disabled="!canDelete || deleting || producing || reopening || activating" @click="deleteSelectedEntitlement">{{ deleting ? 'Deleting…' : 'Delete entitlement' }}</button>
            </details>
          </template>
        </template>
        <p v-else>Select an entitlement to view its details.</p>
      </section>
    </section>
  </main>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="/v2cp-download.js"></script>
  <script src="/pages/entitlements.js"></script>
</body>
</html>
