<!DOCTYPE html>
<html lang="en">
<head>
  <!-- include: head -->
  <title>Log in to EMS</title>
</head>
<body class="login-page">
  <!-- include: disclaimer -->
  <main>
    <h1>Log in to EMS</h1>
    <form id="loginForm">
      <label>
        EMS username
        <input name="username" autocomplete="username" required>
      </label>
      <label>
        EMS password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <p id="savedActHint" class="login-saved-hint" hidden>Saved Act! login will be used.</p>
      <button id="configureButton" type="button" aria-expanded="false" aria-controls="actCredentials">Configure Act! login</button>
      <div id="actCredentials" hidden>
        <p>Save Act! credentials encrypted in this browser using your EMS password.</p>
        <label>
          Act! username
          <input name="actUsername" autocomplete="off">
        </label>
        <label>
          Act! password
          <input name="actPassword" type="password" autocomplete="new-password">
        </label>
      </div>
      <button id="submitButton" class="button--constructive" type="submit">Log in</button>
    </form>
    <div class="login-status"><span id="status" role="status" aria-live="polite"></span><span id="loginDots" aria-hidden="true" hidden></span></div>
    <a id="continueLink" href="/" hidden>Continue without saving Act! credentials</a>
  </main>
  <script src="/login-credentials.js"></script>
  <script src="/pages/login.js"></script>
</body>
</html>
