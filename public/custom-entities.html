<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACT Custom Entities</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #222; font-family: system-ui, sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    .dev-disclaimer { margin: 0; padding: 0; background: #ffeb3b; text-align: center; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem 1.5rem; border-bottom: 1px solid #ddd; }
    h1 { margin: 0; font-size: 1.35rem; }
    .header-actions { display: flex; align-items: center; gap: .75rem; }
    a { color: #123b68; }
    .tab-nav { display: flex; gap: .25rem; padding: 0 1.5rem; border-bottom: 1px solid #ddd; }
    .tab-nav a { padding: .65rem .9rem; color: #444; text-decoration: none; border-bottom: 3px solid transparent; }
    .tab-nav a:hover { background: #f5f5f5; }
    .tab-nav a[aria-current="page"] { color: #123b68; border-bottom-color: #123b68; font-weight: 600; }
    @media (max-width: 600px) { .tab-nav { overflow-x: auto; padding: 0 .5rem; } .tab-nav a { white-space: nowrap; } }
    main { padding: 1.5rem; }
    form { display: flex; flex-wrap: wrap; align-items: end; gap: .6rem; }
    label { display: grid; gap: .25rem; }
    input { min-width: 16rem; padding: .45rem .6rem; }
    #status { min-height: 1.5rem; margin: 1rem 0; color: #666; white-space: pre-wrap; word-break: break-word; }
    #status.error { color: #b00020; }
    table { width: 100%; margin-top: 1rem; border-collapse: collapse; }
    th, td { padding: .45rem .6rem; border-bottom: 1px solid #ddd; text-align: left; vertical-align: top; }
    th { background: #f3f3f3; }
    tbody tr:nth-child(even) { background: #f8f8f8; }
    td { overflow-wrap: anywhere; }
    pre { max-height: 65vh; overflow: auto; padding: 1rem; background: #f5f5f5; white-space: pre-wrap; overflow-wrap: anywhere; }
    [v-cloak] { display: none; }
    @media (max-width: 600px) {
      header { align-items: flex-start; flex-direction: column; }
      .header-actions { flex-wrap: wrap; }
      main { padding: 1rem; }
      input { min-width: 0; width: 100%; }
      form label { width: 100%; }
      table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <div class="dev-disclaimer">DEVELOPMENT - NOT LIVE</div>
  <header>
    <h1>ACT Custom Entities</h1>
    <div class="header-actions">
      <button type="button" @click="loadEntities" :disabled="loading">Reload</button>
      <button type="button" @click="logout" :disabled="loading">Log out</button>
    </div>
  </header>
  <nav class="tab-nav" aria-label="Main navigation">
    <a href="#" onclick="event.preventDefault()">Home</a>
    <a href="#" onclick="event.preventDefault()">Catalog</a>
    <a href="/entitlements.html">Entitlements</a>
    <a href="/">Customers</a>
    <a href="#" onclick="event.preventDefault()">Reports</a>
    <a href="#" onclick="event.preventDefault()">Administration</a>
    <a href="/custom-entities.html" aria-current="page">Developer</a>
  </nav>
  <main id="app" v-cloak>
    <form @submit.prevent="loadEntities">
      <label>
        Entity name <span>(optional)</span>
        <input v-model.trim="entityName" placeholder="Leave blank to list all custom entities">
      </label>
      <button type="submit" :disabled="loading">Load entities</button>
    </form>
    <div id="status" :class="{ error: Boolean(error) }" role="status" aria-live="polite">{{ status }}</div>
    <table v-if="rows.length">
      <thead><tr><th v-for="key in columns" :key="key">{{ key }}</th></tr></thead>
      <tbody>
        <tr v-for="(row, index) in rows" :key="index">
          <td v-for="key in columns" :key="key">{{ formatValue(cellValue(row, key)) }}</td>
        </tr>
      </tbody>
    </table>
    <pre v-else-if="result !== null && !isArrayResult">{{ formattedResult }}</pre>
  </main>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          entityName: '',
          result: null,
          loading: false,
          error: '',
        };
      },
      computed: {
        status() {
          if (this.loading) return 'Loading custom entities…';
          if (this.error) return this.error;
          if (this.result === null) return 'Enter an entity name or leave it blank to list all custom entities.';
          return this.isArrayResult
            ? `${this.rows.length} custom entities`
            : 'Custom entity response loaded.';
        },
        rows() {
          if (Array.isArray(this.result)) return this.result;
          if (this.result && typeof this.result === 'object') {
            for (const key of ['value', 'items', 'entities']) {
              if (Array.isArray(this.result[key])) return this.result[key];
            }
          }
          return [];
        },
        columns() {
          return [...new Set(this.rows.flatMap((row) =>
            row && typeof row === 'object' && !Array.isArray(row) ? Object.keys(row) : ['value']
          ))];
        },
        isArrayResult() {
          return Array.isArray(this.result) ||
            Boolean(this.result && ['value', 'items', 'entities'].some((key) => Array.isArray(this.result[key])));
        },
        formattedResult() {
          return JSON.stringify(this.result, null, 2);
        },
      },
      methods: {
        formatValue(value) {
          return value !== null && typeof value === 'object' ? JSON.stringify(value) : String(value ?? '');
        },
        cellValue(row, key) {
          return key === 'value' && (row === null || typeof row !== 'object') ? row : row[key];
        },
        async loadEntities() {
          this.loading = true;
          this.error = '';
          try {
            const name = this.entityName ? `/${encodeURIComponent(this.entityName)}` : '';
            const response = await fetch(`/api/act/custom-entities${name}`);
            const data = await response.json();
            if (response.status === 401) {
              window.location.replace('/login.html');
              return;
            }
            if (!response.ok) throw new Error(data.error || response.statusText);
            this.result = data;
          } catch (err) {
            this.error = 'Failed to load custom entities: ' + err.message;
          } finally {
            this.loading = false;
          }
        },
        async logout() {
          this.loading = true;
          this.error = '';
          try {
            const response = await fetch('/api/act/logout', { method: 'POST' });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || response.statusText);
            window.location.replace('/login.html');
          } catch (err) {
            this.error = 'Log out failed: ' + err.message;
            this.loading = false;
          }
        },
        async checkSession() {
          try {
            const response = await fetch('/api/act/session');
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || response.statusText);
            if (!data.authenticated) {
              window.location.replace('/login.html');
              return;
            }
            await this.loadEntities();
          } catch (err) {
            this.error = 'Failed to restore Act! session: ' + err.message;
          }
        },
      },
      mounted() {
        this.checkSession();
      },
    }).mount('#app');
  </script>
</body>
</html>
