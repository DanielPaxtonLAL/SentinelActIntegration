<!DOCTYPE html>
<html lang="en">
<head>
  <!-- include: head -->
  <title>ACT Custom Entities</title>
</head>
<body class="custom-entities-page">
  <!-- include: disclaimer -->
  <header>
    <h1>ACT Custom Entities</h1>
    <div class="header-actions">
      <button type="button" class="button--view" @click="loadEntities" :disabled="loading">Reload</button>
      <button type="button" @click="logout" :disabled="loading">Log out</button>
    </div>
  </header>
  <!-- include: nav -->
  <main id="app" v-cloak>
    <form @submit.prevent="loadEntities">
      <label>
        Entity name <span>(optional)</span>
        <input v-model.trim="entityName" placeholder="Leave blank to list all custom entities">
      </label>
      <button type="submit" class="button--view" :disabled="loading">Load entities</button>
    </form>
    <div id="status" :class="{ error: Boolean(error) }" role="status" aria-live="polite">{{ status }}</div>
    <table v-if="rows.length">
      <thead><tr><th v-for="key in columns" :key="key">{{ key }}</th></tr></thead>
      <tbody>
        <tr v-for="(row, index) in rows" :key="index">
          <td v-for="key in columns" :key="key">{{ formatValue(cellValue(row, key)) }}</td>
        </tr>
      </tbody>
    </table>
    <pre v-else-if="result !== null && !isArrayResult">{{ formattedResult }}</pre>
  </main>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="/pages/custom-entities.js"></script>
</body>
</html>
